<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scratch Arcade</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#f5f7fb;background:#07111f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#173f72,#07111f 55%)}
.wrap{width:min(1050px,92%);margin:auto;padding:24px 0 50px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.logo{font-size:26px;font-weight:900}.logo span{color:#ffb52e}
.badge{padding:8px 12px;border-radius:99px;background:#ffffff12;border:1px solid #ffffff18;color:#cbd6e9;font-size:13px}
.hero{padding:25px;border-radius:22px;background:#ffffff0c;border:1px solid #ffffff18;box-shadow:0 20px 50px #0003}
h1{font-size:clamp(32px,7vw,55px);line-height:1;margin:0 0 10px}
.hero p{color:#b8c5d9;margin:0 0 20px}
.row{display:flex;gap:10px;flex-wrap:wrap}
input[type=text]{flex:1;min-width:220px;background:#060c16;color:#fff;border:1px solid #ffffff22;border-radius:12px;padding:13px}
input[type=file]{display:none}
button,.file{border:0;border-radius:12px;padding:13px 16px;font-weight:800;cursor:pointer}
.file,button.primary{background:#ffb52e;color:#241700}
button.secondary{background:#ffffff12;color:#fff;border:1px solid #ffffff20}
.info{margin-top:9px;font-size:13px;color:#8e9bb1}.status{margin-top:10px;color:#cbd5e6;min-height:20px}
h2{margin:28px 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:15px}
.card{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:18px;background:#ffffff0b;border:1px solid #ffffff14}
.card h3{margin:0;overflow-wrap:anywhere}.meta{font-size:13px;color:#93a1b9}
.actions{display:flex;gap:8px;margin-top:auto}.actions>*{flex:1}
.empty{text-align:center;color:#9ca9bf;padding:35px}
button:disabled{opacity:.5;cursor:not-allowed}
footer{text-align:center;color:#718097;font-size:12px;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo">🎮 Scratch <span>Arcade</span></div><div class="badge">☁️ Netlify Blobs</div></header>
<section class="hero">
<h1>Tu sala de juegos 🚀</h1>
<p>Subí proyectos de Scratch, jugalos desde la web y compartilos con tus amigos.</p>
<div class="row">
<input id="title" type="text" maxlength="60" placeholder="Nombre del juego">
<label class="file" for="file">📁 Elegir .sb3</label>
<input id="file" type="file" accept=".sb3,application/zip">
<button id="upload" class="primary">⬆️ Subir juego</button>
</div>
<div id="fileInfo" class="info">Ningún archivo seleccionado.</div>
<div id="status" class="status"></div>
</section>
<h2>🕹️ Juegos de la sala</h2>
<div id="games" class="grid"><div class="empty">Cargando…</div></div>
<footer>Scratch Arcade no es un servicio oficial de Scratch. Los proyectos son compartidos por los usuarios.</footer>
</div>
<script>
const $=id=>document.getElementById(id);
let selected=null;
$("file").onchange=()=>{selected=$("file").files[0]||null;$("fileInfo").textContent=selected?`${selected.name} — ${(selected.size/1024/1024).toFixed(2)} MB`:"Ningún archivo seleccionado."};
function status(t){$("status").textContent=t}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function load(){
 try{
  const r=await fetch("/.netlify/functions/games"); const data=await r.json();
  if(!r.ok) throw Error(data.error||"Error");
  const box=$("games");
  if(!data.games.length){box.innerHTML='<div class="empty">Todavía no hay juegos. ¡Subí el primero! 🥳</div>';return}
  box.innerHTML="";
  data.games.forEach(g=>{
   const c=document.createElement("article"); c.className="card";
   c.innerHTML=`<h3>${esc(g.title)}</h3><div class="meta">📦 ${esc(g.fileName)} · ${g.sizeMB} MB</div><div class="actions"><button class="primary play">▶️ Jugar</button><a class="secondary" href="/.netlify/functions/download?id=${encodeURIComponent(g.id)}" target="_blank">⬇️ Bajar</a></div>`;
   c.querySelector(".play").onclick=()=>{window.open("https://turbowarp.org/?project_url="+encodeURIComponent(location.origin+"/.netlify/functions/download?id="+encodeURIComponent(g.id)),"_blank")};
   box.appendChild(c);
  });
 }catch(e){console.error(e);$("games").innerHTML='<div class="empty">❌ No se pudieron cargar los juegos.</div>'}
}
$("upload").onclick=async()=>{
 if(!selected)return status("Elegí un archivo .sb3.");
 if(!/\.sb3$/i.test(selected.name))return status("Solo se aceptan archivos .sb3.");
 if(selected.size>5*1024*1024)return status("El límite de esta versión es 5 MB por proyecto.");
 const title=$("title").value.trim()||selected.name.replace(/\.sb3$/i,"");
 $("upload").disabled=true;status("⏳ Subiendo…");
 try{
  const fd=new FormData();fd.append("title",title);fd.append("file",selected);
  const r=await fetch("/.netlify/functions/upload",{method:"POST",body:fd});
  const d=await r.json();if(!r.ok)throw Error(d.error||"No se pudo subir");
  status("✅ ¡Juego subido!");
  $("title").value="";$("file").value="";selected=null;$("fileInfo").textContent="Ningún archivo seleccionado.";
  await load();
 }catch(e){console.error(e);status("❌ "+e.message)}finally{$("upload").disabled=false}
};
load();
</script>
</body>
</html>
